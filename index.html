<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoom Bot Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d0d1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { font-size: 24px; background: linear-gradient(90deg, #7a5cff, #00d2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; background: rgba(122,92,255,0.15); color: #7a5cff; border: 1px solid rgba(122,92,255,0.2); }
        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px; margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .number { font-size: 28px; font-weight: 600; }
        .stat-card .label { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 16px; margin-bottom: 14px; color: rgba(255,255,255,0.8); }
        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .form-group label { font-size: 12px; color: rgba(255,255,255,0.4); text-transform: uppercase; }
        .form-group input, .form-group select {
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus { border-color: #7a5cff; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: linear-gradient(90deg, #7a5cff, #00d2ff); color: #fff; }
        .btn-danger { background: linear-gradient(90deg, #ff4444, #ff6b6b); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.06); }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .status-bar {
            padding: 10px 14px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            margin-top: 12px;
            font-family: monospace;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }
        .log-container {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .log-entry .time { color: rgba(255,255,255,0.3); margin-right: 8px; }
        .worker-list {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-family: monospace;
            color: rgba(255,255,255,0.5);
        }
        .worker-list .used { color: #00d2ff; }
        .worker-list .free { color: #00ff64; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>🚀 ZOOM BOT</h1>
            <span class="badge">Pro</span>
        </div>
        <div>
            <span id="usageDisplay">Usage: 0/0</span>
            <span style="margin-left:16px;" id="availableDisplay">Available: 0</span>
            <button class="btn-secondary" onclick="refreshStatus()" style="margin-left:12px;">🔄</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="number" id="totalBots">0</div><div class="label">Total Workers</div></div>
        <div class="stat-card"><div class="number" id="runningBots">0</div><div class="label">Used Workers</div></div>
        <div class="stat-card"><div class="number" id="activeMeetings">0</div><div class="label">Active Meetings</div></div>
        <div class="stat-card"><div class="number" id="availableBots">0</div><div class="label">Available</div></div>
    </div>

    <div class="card">
        <h2>📌 Meeting Controls</h2>
        <div class="form-row">
            <div class="form-group">
                <label>Meeting ID</label>
                <input type="text" id="meetingId" value="5415403058" />
            </div>
            <div class="form-group">
                <label>Passcode</label>
                <input type="text" id="passcode" value="850893" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Bots Count (max workers)</label>
                <input type="number" id="botCount" value="50" min="1" />
            </div>
            <div class="form-group">
                <label>Name Type</label>
                <select id="nameType">
                    <option value="indian">🇮🇳 Indian</option>
                    <option value="english">🇺🇸 English</option>
                    <option value="custom">✏️ Custom</option>
                </select>
            </div>
        </div>
        <div class="form-group" id="customNamesGroup" style="display:none;">
            <label>Custom Names (one per line)</label>
            <textarea id="customNames" rows="3" style="padding:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:#fff;"></textarea>
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="startBots()">🚀 Start Bots</button>
            <button class="btn btn-danger" onclick="killMeeting()">⏹️ Kill Meeting</button>
            <button class="btn btn-secondary" onclick="refreshStatus()">🔄 Refresh Status</button>
        </div>
        <div class="status-bar" id="statusBar">✅ Ready to start bots...</div>
    </div>

    <div class="card">
        <h2>📊 Live Logs</h2>
        <div class="log-container" id="logsContainer">
            <div class="log-placeholder" style="color:rgba(255,255,255,0.2);text-align:center;padding:20px;">No activity yet</div>
        </div>
    </div>

    <div class="card">
        <h2>📋 Worker List</h2>
        <div class="worker-list" id="workerList">Loading...</div>
    </div>
</div>

<script>
const API_URL = 'https://zoom-master-system-production.up.railway.app'; // change to your master URL

// ============================================
// HELPERS
// ============================================
function addLog(msg) {
    const container = document.getElementById('logsContainer');
    const placeholder = container.querySelector('.log-placeholder');
    if (placeholder) placeholder.remove();
    const div = document.createElement('div');
    div.className = 'log-entry';
    const ts = new Date().toLocaleTimeString('en-IN', { hour12: false });
    div.innerHTML = `<span class="time">[${ts}]</span> ${msg}`;
    container.prepend(div);
    while (container.children.length > 50) container.removeChild(container.lastChild);
}

function showStatus(msg, type) {
    const bar = document.getElementById('statusBar');
    bar.textContent = msg;
    bar.style.color = type === 'success' ? '#00ff64' : type === 'error' ? '#ff4444' : 'rgba(255,255,255,0.6)';
}

// ============================================
// START BOTS
// ============================================
async function startBots() {
    const meetingId = document.getElementById('meetingId').value.trim();
    const passcode = document.getElementById('passcode').value.trim();
    const botCount = parseInt(document.getElementById('botCount').value) || 1;
    const nameType = document.getElementById('nameType').value;
    const customNames = document.getElementById('customNames').value.split('\n').filter(n => n.trim());

    if (!meetingId) {
        showStatus('❌ Please enter Meeting ID', 'error');
        return;
    }

    showStatus('⏳ Starting bots...', '');
    addLog(`⏳ Starting ${botCount} bots for ${meetingId}`);

    try {
        const body = {
            meeting_code: meetingId,
            passcode: passcode,
            bot_count: botCount,
            duration_minutes: 10,
            name_type: nameType,
            custom_names: customNames.length ? customNames : undefined
        };
        const res = await fetch(`${API_URL}/api/start-bots`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
            showStatus(`✅ ${data.message} (${data.total_bots} bots)`, 'success');
            addLog(`✅ Started ${data.total_bots} bots for ${meetingId}`);
            refreshStatus();
        } else {
            showStatus(`❌ Failed: ${data.detail || 'Unknown error'}`, 'error');
            addLog(`❌ Start failed: ${data.detail}`);
        }
    } catch(e) {
        showStatus(`❌ Error: ${e.message}`, 'error');
        addLog(`❌ Error: ${e.message}`);
    }
}

// ============================================
// KILL MEETING
// ============================================
async function killMeeting() {
    const meetingId = document.getElementById('meetingId').value.trim();
    if (!meetingId) {
        showStatus('❌ Please enter Meeting ID', 'error');
        return;
    }
    if (!confirm(`Kill all bots in meeting ${meetingId}?`)) return;

    showStatus('⏳ Killing meeting...', '');
    addLog(`⏳ Killing meeting ${meetingId}`);

    try {
        const res = await fetch(`${API_URL}/api/kill-meeting`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ meeting_code: meetingId })
        });
        const data = await res.json();
        if (data.success) {
            showStatus(`✅ ${data.message} (${data.total_bots_killed || 0} bots killed)`, 'success');
            addLog(`✅ Killed meeting ${meetingId} - ${data.total_bots_killed || 0} bots killed`);
            refreshStatus();
        } else {
            showStatus(`❌ Failed: ${data.detail || 'Unknown error'}`, 'error');
            addLog(`❌ Kill failed: ${data.detail}`);
        }
    } catch(e) {
        showStatus(`❌ Error: ${e.message}`, 'error');
        addLog(`❌ Error: ${e.message}`);
    }
}

// ============================================
// REFRESH STATUS
// ============================================
async function refreshStatus() {
    try {
        const res = await fetch(`${API_URL}/api/status`);
        const data = await res.json();
        const total = data.total_capacity || 0;
        const used = data.used_workers || 0;
        const available = data.available_workers || 0;
        const meetings = Object.keys(data.active_meetings || {}).length;

        document.getElementById('totalBots').textContent = total;
        document.getElementById('runningBots').textContent = used;
        document.getElementById('activeMeetings').textContent = meetings;
        document.getElementById('availableBots').textContent = available;
        document.getElementById('usageDisplay').textContent = `Usage: ${used}/${total}`;
        document.getElementById('availableDisplay').textContent = `Available: ${available}`;

        // Update worker list
        const workerList = document.getElementById('workerList');
        if (data.workers && data.workers.length) {
            let html = '';
            for (const w of data.workers) {
                const status = w.used ? '🔴 Used' : '🟢 Free';
                const cls = w.used ? 'used' : 'free';
                html += `<div class="${cls}">${w.url} - ${status}</div>`;
            }
            workerList.innerHTML = html;
        } else {
            workerList.innerHTML = 'No workers loaded.';
        }
    } catch(e) {
        console.error('Status refresh failed:', e);
    }
}

// ============================================
// CUSTOM NAMES TOGGLE
// ============================================
document.getElementById('nameType').addEventListener('change', function() {
    document.getElementById('customNamesGroup').style.display = this.value === 'custom' ? 'block' : 'none';
});

// ============================================
// AUTO REFRESH
// ============================================
setInterval(refreshStatus, 5000);
refreshStatus();
</script>
</body>
</html>
